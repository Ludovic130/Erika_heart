name: Build APK with Docker (libffi patch)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Docker + patch libffi
        run: |
          docker run --rm \
            -v $(pwd):/home/user/host \
            -v ~/.buildozer:/home/user/.buildozer \
            -w /home/user/host \
            ghcr.io/kivy/buildozer:latest \
            sh -c "
              # Install missing libtool dependencies
              apt-get update && apt-get install -y libtool libltdl-dev

              # Patch libffi recipe to avoid autoreconf
              sed -i 's/autoreconf -ivf/echo "skipping autoreconf"/g' /home/user/.venv/lib/python*/site-packages/pythonforandroid/recipes/libffi/__init__.py

              # Run buildozer with yes
              yes | buildozer android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erika_heart_APK
          path: bin/*.apk
