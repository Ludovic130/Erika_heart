name: Build APK with python-for-android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev libncurses6 libncurses-dev \
            libffi-dev libssl-dev liblzma-dev \
            autoconf automake libtool \
            git zip unzip openjdk-17-jdk \
            wget

      - name: Install python-for-android
        run: |
          pip install --upgrade pip
          pip install python-for-android

      - name: Set up Android SDK and NDK
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33"
          sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> $GITHUB_PATH
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Build APK with p4a
        run: |
          p4a apk \
            --private . \
            --package=org.example.heartErika \
            --name="My heart Erika" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements=python3.10,kivy \
            --arch=arm64-v8a \
            --arch=armeabi-v7a \
            --android-api=33 \
            --ndk-api=24 \
            --allow-root \
            --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erika_heart_APK
          path: bin/*.apk
