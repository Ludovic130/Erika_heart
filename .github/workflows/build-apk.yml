name: Build Kivy APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Docker
        run: |
          docker run --rm \
            -v $(pwd):/home/user/host \
            -v ~/.buildozer:/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            sh -c "echo y | buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Erika_heart_APK
          path: bin/*.apk
